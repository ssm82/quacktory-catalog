<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quacktory — Serious ducks for un-serious people</title>
<meta name="description" content="Quacktory: rubber ducks from 4 cm to 3 m. Solid rubber, no inserts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<a href="#main" class="skip">skip to content</a>

<main id="main">

<!-- ============ HERO ============ -->
<section class="hero" aria-label="Hero">
  <div class="scene" aria-hidden="true">
    <span class="cloud c1"></span>
    <span class="cloud c2"></span>
    <span class="cloud c3"></span>
    <span class="cloud c4"></span>
    <span class="tw t1">✦</span>
    <span class="tw t2">✧</span>
    <span class="tw t3">✦</span>
    <span class="tw t4">✧</span>
    <span class="tw t5">✦</span>
    <span class="tw t6">✧</span>
    <span class="tw t7">✦</span>
    <span class="tw t8">✧</span>
    <span class="hill hill-far"></span>
    <span class="fog fog-far"></span>
    <span class="hill hill-mid"></span>
    <span class="gate"><span class="gate-sign">QUACKTORY</span></span>
    <span class="fog fog-near"></span>
    <span class="ground"></span>
    <span class="field"></span>
    <span class="pole p-l"><span class="flag flag-orange"></span></span>
    <span class="pole p-r"><span class="flag flag-blue"></span></span>
  </div>

  <div class="bookend b-l" aria-hidden="true">
    <svg class="duck duck-xl" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="100" cy="135" rx="68" ry="50" fill="#F2A45A" stroke="#1F4FB8" stroke-width="6"/>
      <ellipse cx="110" cy="140" rx="28" ry="16" fill="#E8652A" stroke="#1F4FB8" stroke-width="4"/>
      <circle cx="95" cy="80" r="44" fill="#F2A45A" stroke="#1F4FB8" stroke-width="6"/>
      <path d="M 130 88 Q 158 90 160 102 Q 156 112 130 108 Z" fill="#E8652A" stroke="#1F4FB8" stroke-width="4"/>
      <line x1="130" y1="103" x2="160" y2="103" stroke="#1F4FB8" stroke-width="2" opacity="0.4"/>
      <circle cx="100" cy="72" r="9" fill="#F7F1E2" stroke="#1F4FB8" stroke-width="2.5"/>
      <circle cx="102" cy="73" r="4.5" fill="#1F4FB8"/>
      <circle cx="103.5" cy="71" r="1.8" fill="#fff"/>
      <path d="M 80 40 Q 90 30 100 36 Q 110 30 120 40" fill="#F2A45A" stroke="#1F4FB8" stroke-width="3"/>
    </svg>
  </div>
  <div class="bookend b-r" aria-hidden="true">
    <svg class="duck duck-xl" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="100" cy="135" rx="68" ry="50" fill="#F2A45A" stroke="#1F4FB8" stroke-width="6"/>
      <ellipse cx="110" cy="140" rx="28" ry="16" fill="#E8652A" stroke="#1F4FB8" stroke-width="4"/>
      <circle cx="95" cy="80" r="44" fill="#F2A45A" stroke="#1F4FB8" stroke-width="6"/>
      <path d="M 130 88 Q 158 90 160 102 Q 156 112 130 108 Z" fill="#E8652A" stroke="#1F4FB8" stroke-width="4"/>
      <line x1="130" y1="103" x2="160" y2="103" stroke="#1F4FB8" stroke-width="2" opacity="0.4"/>
      <circle cx="100" cy="72" r="9" fill="#F7F1E2" stroke="#1F4FB8" stroke-width="2.5"/>
      <circle cx="102" cy="73" r="4.5" fill="#1F4FB8"/>
      <circle cx="103.5" cy="71" r="1.8" fill="#fff"/>
      <path d="M 80 40 Q 90 30 100 36 Q 110 30 120 40" fill="#F2A45A" stroke="#1F4FB8" stroke-width="3"/>
    </svg>
  </div>

  <div class="hero-stack">
    <h1 class="logo">
      <span class="logo-a">QUACK</span><span class="logo-b">TORY</span>
    </h1>
    <p class="logo-sub">rubber ducks · from 4 cm to 3 m</p>

    <a href="#start" class="cta cta-trip" id="start">Start the trip</a>

    <p class="manifest">
      <span>We make ducks you don't want to</span>
      <span><b>let into the water — you want to put on a shelf.</b></span>
      <span>Small ones — in a pocket. Big ones — in a foyer. All of them — in frame.</span>
    </p>
  </div>
</section>

</main>

  <a href="#" class="foot-policy">Privacy Policy</a>

</body>
</html>
