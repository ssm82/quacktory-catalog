<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quacktory — Serious ducks for un-serious people</title>
  <meta name="description" content="Quacktory — rubber ducks from 4 cm to 3 m. Keychains, bathtub classics, collections, installations. Move with us.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="top">
    <!-- HERO — pattern D: illustrated centerpiece -->
    <section class="scene" aria-label="Hero">
      <div class="scene__sky" aria-hidden="true">
        <span class="bubble bubble--a"></span>
        <span class="bubble bubble--b"></span>
        <span class="bubble bubble--c"></span>
        <span class="bubble bubble--d"></span>
        <span class="bubble bubble--e"></span>
        <span class="bubble bubble--f"></span>

        <span class="heart heart--f1"></span>
        <span class="heart heart--f2"></span>
        <span class="heart heart--f3"></span>
        <span class="heart heart--f4"></span>
        <span class="heart heart--f5"></span>
        <span class="heart heart--f6"></span>
        <span class="heart heart--f7"></span>
        <span class="heart heart--f8"></span>

        <span class="sparkle sparkle--s1"></span>
        <span class="sparkle sparkle--s2"></span>
        <span class="sparkle sparkle--s3"></span>
        <span class="sparkle sparkle--s4"></span>
      </div>

      <div class="scene__lockup">
        <div class="mascot mascot--mini" aria-hidden="true">
          <span class="mascot__body"></span>
          <span class="mascot__head"></span>
          <span class="mascot__beak"></span>
          <span class="mascot__pupil mascot__pupil--l"></span>
          <span class="mascot__pupil mascot__pupil--r"></span>
          <span class="mascot__heart mascot__heart--l"></span>
          <span class="mascot__heart mascot__heart--r"></span>
          <span class="mascot__reflect"></span>
        </div>

        <div class="mascot mascot--mid" aria-hidden="true">
          <span class="mascot__body"></span>
          <span class="mascot__head"></span>
          <span class="mascot__beak"></span>
          <span class="mascot__pupil mascot__pupil--l"></span>
          <span class="mascot__pupil mascot__pupil--r"></span>
          <span class="mascot__heart mascot__heart--l"></span>
          <span class="mascot__heart mascot__heart--r"></span>
          <span class="mascot__reflect"></span>
        </div>

        <h1 class="scene__wordmark" aria-label="Quacktory">
          <span class="scene__wordmark-q">q</span><span class="scene__wordmark-u">u</span><span class="scene__wordmark-rest">acktory</span>
        </h1>

        <div class="mascot mascot--big" aria-hidden="true">
          <span class="mascot__body"></span>
          <span class="mascot__head"></span>
          <span class="mascot__beak"></span>
          <span class="mascot__pupil mascot__pupil--l"></span>
          <span class="mascot__pupil mascot__pupil--r"></span>
          <span class="mascot__heart mascot__heart--l"></span>
          <span class="mascot__heart mascot__heart--r"></span>
          <span class="mascot__reflect"></span>
        </div>
      </div>

      <div class="scene__hero">
        <div class="hero-duck" aria-label="Quacktory hero duck">
          <svg class="hero-duck__svg" viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <ellipse cx="200" cy="305" rx="130" ry="8" fill="#2B2A29" opacity="0.12"/>
            <ellipse cx="160" cy="290" rx="32" ry="9" fill="#F39C12"/>
            <ellipse cx="240" cy="290" rx="32" ry="9" fill="#F39C12"/>
            <ellipse cx="200" cy="220" rx="135" ry="95" fill="#F4D03F"/>
            <ellipse cx="200" cy="240" rx="80" ry="40" fill="#FFE066" opacity="0.4"/>
            <path d="M 95 195 Q 65 210 80 260 Q 110 268 130 245 Q 125 205 95 195 Z" fill="#E8B923"/>
            <path d="M 305 195 Q 335 210 320 260 Q 290 268 270 245 Q 275 205 305 195 Z" fill="#E8B923"/>
            <ellipse cx="200" cy="120" rx="105" ry="90" fill="#F4D03F"/>
            <path d="M 200 32 L 195 18 Q 200 14 205 18 Z" fill="#E8B923"/>
            <ellipse cx="135" cy="140" rx="15" ry="9" fill="#FFB6C1" opacity="0.75"/>
            <ellipse cx="265" cy="140" rx="15" ry="9" fill="#FFB6C1" opacity="0.75"/>
            <ellipse cx="200" cy="170" rx="58" ry="20" fill="#F39C12"/>
            <ellipse cx="200" cy="172" rx="54" ry="16" fill="#FFB627"/>
            <ellipse cx="200" cy="184" rx="48" ry="13" fill="#E67E22"/>
            <path d="M 144 178 Q 200 184 256 178" stroke="#C0651B" stroke-width="1.5" fill="none" opacity="0.6"/>
            <ellipse cx="162" cy="105" rx="18" ry="22" fill="white"/>
            <ellipse cx="238" cy="105" rx="18" ry="22" fill="white"/>
            <path d="M 162 110 C 152 96, 142 102, 150 115 L 162 127 L 174 115 C 182 102, 172 96, 162 110 Z" fill="#E60012"/>
            <path d="M 238 110 C 228 96, 218 102, 226 115 L 238 127 L 250 115 C 258 102, 248 96, 238 110 Z" fill="#E60012"/>
            <ellipse cx="155" cy="103" rx="3" ry="2" fill="white" opacity="0.75"/>
            <ellipse cx="231" cy="103" rx="3" ry="2" fill="white" opacity="0.75"/>
          </svg>
          <div class="hero-duck__glow" aria-hidden="true"></div>
          <div class="hero-duck__ring" aria-hidden="true"></div>
        </div>
      </div>

      <div class="scene__copy">
        <p class="scene__credo">Serious ducks for un-serious people</p>
        <p class="scene__manifesto">
          We make ducks you'll want<br>
          to keep on a shelf rather than float in a bath.<br>
          <span class="scene__manifesto-em">Small ones — in your pocket. Big ones — in the lobby. All of them — in the frame.</span>
        </p>
      </div>

      <div class="scene__ground" aria-hidden="true">
        <div class="scene__reflection scene__reflection--hero"></div>
        <div class="scene__floor"></div>
      </div>
    </section>

  </main>

  <script src="main.js" defer></script>
</body>
</html>
